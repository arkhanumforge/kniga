name: One-time branch retirement
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-branches.yml']
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Archive unique commits and retire exact authorized branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          branches=(claude/zen-planck-o10uy7 cursor/optimize-book-context-56f4 docs-revision docs-revision-backup)
          shas=(d2d1ad06c9d02a396886a3a06b5ec8c3e7a0246f a20f69d1cd1d78656cee0dfad6e9dcb2ae24ee03 2a1fcde365f85c12d655c6e128a92bb2626d0dda b0a43ad0439b9a318af687a5ec1f4203fd66c076)
          leases=()
          deletes=()
          for i in "${!branches[@]}"; do
            ref="refs/heads/${branches[$i]}"
            actual="$(git ls-remote --refs origin "$ref" | cut -f1)"
            test "$actual" = "${shas[$i]}"
            git fetch origin "$ref"
            git cat-file -e "${shas[$i]}^{commit}"
            leases+=("--force-with-lease=$ref:${shas[$i]}")
            deletes+=(":$ref")
          done
          git merge-base --is-ancestor "${shas[2]}" origin/main
          git merge-base --is-ancestor "${shas[3]}" origin/main
          # The two old agent branches contain unique commits; preserve exact snapshots as tags.
          tags=(refs/tags/archive/claude-zen-planck-o10uy7 refs/tags/archive/cursor-optimize-book-context-56f4)
          tagpush=()
          for i in 0 1; do
            actual="$(git ls-remote --refs origin "${tags[$i]}" | cut -f1)"
            if [[ -n "$actual" && "$actual" != "${shas[$i]}" ]]; then
              echo "Archive tag already exists with different content"; exit 1
            fi
            tagpush+=("${shas[$i]}:${tags[$i]}")
          done
          git push --atomic "${leases[@]}" origin "${tagpush[@]}" "${deletes[@]}"
          git ls-remote --heads origin
